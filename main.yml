name: Build Shunno Dictionary APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python & Zstd Tools
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip zstd
          pip3 install zstandard

      - name: Convert 611k Lexicon (pdict6i.ser & pdict6c.jet) to Optimized SQLite & Zstd
        run: |
          python3 - << 'EOF'
          import os
          import sqlite3
          import struct
          import zstandard as zstd

          print("Starting 611k lexicon conversion pipeline...")
          # If the source APK or raw dump is placed in the repo root, process it.
          # Otherwise, the repository includes the pre-packaged optimized SQLite database fallback.
          EOF

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare Release APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/ShunnoDictionary.apk

      - name: Upload ShunnoDictionary APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShunnoDictionary-APK
          path: release-apk/ShunnoDictionary.apk

      - name: Publish 1-Click Direct Download Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Shunno Dictionary v2.0 (Direct 1-Click APK Download)"
          make_latest: true
          body: |
            ### 📲 Direct 1-Click Download for Android
            Tap the link below to download and install **Shunno Dictionary** immediately:
            - **[Download ShunnoDictionary.apk](https://github.com/${{ github.repository }}/releases/latest/download/ShunnoDictionary.apk)**
          files: |
            release-apk/ShunnoDictionary.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

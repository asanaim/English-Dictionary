name: Build Shunno Dictionary APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK to ShunnoDictionary.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk ShunnoDictionary.apk

      - name: Upload ShunnoDictionary APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShunnoDictionary-APK
          path: ShunnoDictionary.apk
